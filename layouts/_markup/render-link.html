{{- /* External links open in a new tab (replaces kramdown's {:target="_blank"}). */ -}}
{{- $u := urls.Parse .Destination -}}
{{- $external := and $u.IsAbs (ne $u.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if $external }} target="_blank" rel="noopener"{{ end }}>{{ .Text }}</a>
{{- /* chomp trailing newline */ -}}
